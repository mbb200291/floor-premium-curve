name: Latest presale analysis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/latest-analysis.yml"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Download latest MOI presale data
        run: python scripts/download_latest.py --kind presale --output-dir data/raw/latest

      - name: Run latest analysis
        run: |
          python scripts/run_analysis.py \
            --input-dir data/raw/latest/presale/csv \
            --kind presale \
            --output data/processed/latest_curve.csv \
            --observations data/processed/latest_observations.csv \
            --special-floors data/processed/latest_special_floors.csv \
            --model-effects data/processed/latest_model_special_effects.csv \
            --model-curve data/processed/latest_model_curve.csv \
            --plot results/latest_curve.svg \
            --model-plot results/latest_model_curve.svg \
            --summary results/latest_summary.md

      - name: Preserve source metadata
        run: cp data/raw/latest/presale/metadata.json data/processed/latest_source_metadata.json

      - name: Upload full observations
        uses: actions/upload-artifact@v4
        with:
          name: latest-presale-observations
          path: data/processed/latest_observations.csv
          retention-days: 30

      - name: Commit compact latest results
        run: |
          rm -f data/processed/latest_observations.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/latest_curve.csv \
            data/processed/latest_special_floors.csv \
            data/processed/latest_model_special_effects.csv \
            data/processed/latest_model_curve.csv \
            data/processed/latest_source_metadata.json \
            results/latest_curve.svg \
            results/latest_model_curve.svg \
            results/latest_summary.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh latest presale analysis [skip ci]"
            git push
          fi
