name: Full historical presale analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-history-analysis.yml"
      - "scripts/download_history.py"
      - "scripts/run_analysis.py"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Download historical MOI quarters
        run: |
          python scripts/download_history.py \
            --start-season 110S3 \
            --output-dir data/raw/history

      - name: Download latest MOI release
        run: python scripts/download_latest.py --kind presale --output-dir data/raw/latest

      - name: Run full analysis
        run: |
          python scripts/run_analysis.py \
            --input-dir data/raw \
            --kind presale \
            --output data/processed/full_curve.csv \
            --observations data/processed/full_observations.csv \
            --special-floors data/processed/full_special_floors.csv \
            --model-effects data/processed/full_model_special_effects.csv \
            --model-curve data/processed/full_model_curve.csv \
            --plot results/full_curve.svg \
            --model-plot results/full_model_curve.svg \
            --summary results/full_summary.md

      - name: Preserve source metadata
        run: |
          cp data/raw/history/metadata.json data/processed/full_history_source_metadata.json
          cp data/raw/latest/presale/metadata.json data/processed/full_latest_source_metadata.json

      - name: Upload full observations
        uses: actions/upload-artifact@v4
        with:
          name: full-presale-observations
          path: data/processed/full_observations.csv
          retention-days: 30

      - name: Commit compact full-history results
        run: |
          rm -f data/processed/full_observations.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/full_curve.csv \
            data/processed/full_special_floors.csv \
            data/processed/full_model_special_effects.csv \
            data/processed/full_model_curve.csv \
            data/processed/full_history_source_metadata.json \
            data/processed/full_latest_source_metadata.json \
            results/full_curve.svg \
            results/full_model_curve.svg \
            results/full_summary.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: refresh full presale analysis [skip ci]"
            git pull --rebase origin main
            git push
          fi
